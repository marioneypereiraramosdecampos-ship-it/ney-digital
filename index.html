<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ney Digital — Sites, Identidade Visual e Marketing</title>

  <!-- Custom Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family:'Inter',sans-serif}
    h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif}
  </style>
</head>
<body class="bg-[#080808] text-white antialiased">
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#080808]/80 border-b border-white/[0.06]">
    <div class="max-w-[1280px] mx-auto px-6 md:px-10 h-[72px] flex items-center justify-between">
      <div class="display flex items-center gap-2 text-[18px] font-bold">
        <div class="w-8 h-8 rounded-full bg-[#D9FF00] flex items-center justify-center text-black text-[14px]">n</div>
        <span>ney.digital</span>
      </div>
      <nav class="flex items-center gap-6 text-[14px]">
        <a href="#servicos" class="opacity-60 hover:opacity-100">Serviços</a>
        <a href="#contato" class="opacity-60 hover:opacity-100">Contato</a>
        <a href="#contato" class="hidden md:inline-flex bg-[#D9FF00] text-black px-6 py-2.5 rounded-full font-bold">Começar projeto</a>
      </nav>
    </div>
  </header>
  <main class="max-w-[1280px] mx-auto px-6 md:px-10 pt-16 md:pt-28 pb-16">
    <div class="inline-flex items-center gap-2 text-[11px] tracking-[0.18em] uppercase opacity-60 border border-white/10 rounded-full px-3 py-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-[#D9FF00]"></span>
      Agência digital — projetos para 2026
    </div>
    <h1 class="display text-[42px] md:text-[72px] lg:text-[96px] leading-[0.88] font-bold max-w-[14ch] mt-10">
      Transformamos ideias em
      <span class="text-[#D9FF00] block mt-1">resultados digitais.</span>
    </h1>
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mt-10">
      <p class="opacity-60 max-w-xl text-[18px] md:text-[20px] leading-[1.5]">
        Sites, identidade visual e marketing para fazer sua marca decolar.
      </p>
      <div class="flex gap-3">
        <a href="#contato" class="bg-[#D9FF00] text-black px-8 py-4 rounded-full font-bold">Iniciar projeto</a>
        <a href="#servicos" class="px-8 py-4 rounded-full border border-white/15 font-medium">Ver serviços</a>
      </div>
    </div>
  </main>
</body>
</html>
